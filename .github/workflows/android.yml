    # ЭТОТ ШАГ автоматически создаст ВСЕ необходимые файлы конфигурации для Gradle
    - name: Force Create Gradle Config Files
      run: |
        echo "1. Создаем корневой build.gradle.kts..."
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

        echo "2. Создаем корневой settings.gradle.kts..."
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "alarmapp"
        include(":app")
        EOF

        echo "3. Создаем структуру папок для модуля app..."
        mkdir -p app
        
        echo "4. Записываем эталонный app/build.gradle.kts..."
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.kavabanga.alarmapp"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.kavabanga.alarmapp"
                minSdk = 26
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
            }

            buildTypes {
                release {
                    isMinifyEnabled = false
                    proguardFiles(
                        getDefaultProguardFile("proguard-android-optimize.txt"),
                        "proguard-rules.pro"
                    )
                }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
        }

        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("com.google.android.material:material:1.11.0")
            implementation("com.squareup.okhttp3:okhttp:4.12.0")
        }
        EOF
        echo "Все конфигурационные файлы успешно созданы!"
