name: Android CI (Автосборка APK)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем код (обновлено до v5 для поддержки Node 24+)
    - name: Checkout project code
      uses: actions/checkout@v5

    # 2. Устанавливаем Java (перешли на v5, убирает варнинг о депрекации)
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Генерируем Gradle Wrapper, если его нет в репозитории
    - name: Generate Gradle Wrapper
      run: |
        if [ ! -f "gradlew" ]; then
          echo "Gradlew not found. Generating wrapper..."
          gradle wrapper --gradle-version 8.5
        fi

    # 4. Даем права на запуск скрипта сборщика
    - name: Grant execute permissions for gradlew
      run: chmod +x gradlew

    # 5. Компилируем проект
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 6. Сохраняем готовый файл (обновлено до v5 для стабильной работы)
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v5
      with:
        name: server-alarm-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
