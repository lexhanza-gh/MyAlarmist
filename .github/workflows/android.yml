name: Android CI (Автосборка APK)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout project code
      uses: actions/checkout@v5

    # ЭТОТ ШАГ автоматически создаст правильный файл конфигурации прямо внутри папки app
    - name: Force Create app/build.gradle.kts
      run: |
        echo "Создаем структуру папок для модуля app..."
        mkdir -p app
        
        echo "Записываем эталонный build.gradle.kts с указанием namespace..."
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.kavabanga.alarmapp"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.kavabanga.alarmapp"
                minSdk = 26
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
            }

            buildTypes {
                release {
                    isMinifyEnabled = false
                    proguardFiles(
                        getDefaultProguardFile("proguard-android-optimize.txt"),
                        "proguard-rules.pro"
                    )
                }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
        }

        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("com.google.android.material:material:1.11.0")
            implementation("com.squareup.okhttp3:okhttp:4.12.0")
        }
        EOF
        echo "Файл конфигурации модуля app успешно создан!"

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Gradle Wrapper
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper --gradle-version 8.5
        fi

    - name: Grant execute permissions for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew clean assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v5
      with:
        name: server-alarm-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
