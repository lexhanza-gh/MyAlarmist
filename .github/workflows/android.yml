name: Android CI (Автосборка APK)
# Скрипт запускается при каждом пуше (push) в ветку main (или master)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # Позволяет запускать сборку вручную через вкладку Actions на GitHub
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем исходный код репозитория на виртуальную машину (обновлено до v5 для поддержки Node 24+)
    - name: Checkout project code
      uses: actions/checkout@v5

    # 2. Устанавливаем Java (перешли на v5, убирает варнинг о депрекации)  (необходима для сборки Android проектов)
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
    # Добавлено для исправления зависимостей, при использовании Jetpack Compose
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-37.0 build-tools;36.0.0'
        
#    - name: Create symlink for Android 37
#      run: ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
      
    # 3. Генерируем Gradle Wrapper, если его нет в репозитории
    - name: Generate Gradle Wrapper
      run: |
        if [ ! -f "gradlew" ]; then
          echo "Gradlew not found. Generating wrapper..."
           gradle wrapper --gradle-version 9.9.1
        fi
        # old string         gradle wrapper --gradle-version 8.5


    # 4. Даем права на запуск скрипта сборщика
    - name: Grant execute permissions for gradlew
      run: chmod +x gradlew

    - name: Report Gradlew version
      run: ./gradlew -v


    - name: Check Installed Android SDK Components
      run: |
          echo "ANDROID_HOME is set to: $ANDROID_HOME" 
          # Use sdkmanager to list all installed packages (platforms, build-tools, NDK, etc.)
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed

    - name: Check Specific Folders (Alternative)
      run: |
          echo "=== Installed SDK Platforms ==="
          ls -la "$ANDROID_HOME/platforms"  
          echo "=== Installed Build Tools ==="
          ls -la "$ANDROID_HOME/build-tools"      
          echo "=== Platform Tools (ADB) Version ==="
          "$ANDROID_HOME/platform-tools/adb" version
          
    - name: Process Debug Manifest
      run: ./gradlew :app:processDebugManifest --info --stacktrace

    - name: Upload Merged Manifest
      if: always() # Загрузит файл, даже если предыдущий шаг упал с ошибкой
      uses: actions/upload-artifact@v5
      with:
        name: merged-debug-manifest
        path: |
          app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml
          app/build/intermediates/**/AndroidManifest.xml
          app/build/intermediates/merged_manifest/**/AndroidManifest.xml
          app/build/intermediates/packaged_manifests/**/AndroidManifest.xml
        if-no-files-found: warn # Не ронять сборку, если какой-то из путей не создался

    # Компилируем проект
#    - name: Build Debug APK
#      run: ./gradlew assembleDebug
#     run: ./gradlew clean assembleDebug  # очистка кэша перед сборкой


    # GitHub сам генерирует уникальный ключ подписи приложения прямо в процессе сборки
    - name: Generate Keystore on the fly
      run: |
        keytool -genkey -v \
          -keystore app/release-key.jks \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -alias my-alias \
          -storepass temp_password123 \
          -keypass temp_password123 \
          -dname "CN=AlarmApp, O=Kavabanga, C=RU"
          
    # Собираем чистый релизный APK и подписываем его только что созданным ключом
    - name: Build Debug APK with signed Release
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=release-key.jks \
          -Pandroid.injected.signing.store.password=temp_password123 \
          -Pandroid.injected.signing.key.alias=my-alias \
          -Pandroid.injected.signing.key.password=temp_password123


    # 6. Сохраняем готовый файл (обновлено до v5 для стабильной работы)
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v5
      with:
        name: server-alarm-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
