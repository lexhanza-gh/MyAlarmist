name: Android CI (Полная очистка и сборка APK)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout project code
      uses: actions/checkout@v5

    # ШАГ ОЧИСТКИ: Вырезаем устаревший синтаксис package из всех конфигурационных файлов проекта
    - name: Fix Package Attribute in Gradle Files
      run: |
        echo "Ищем и удаляем строки с 'package=' в файлах build.gradle..."
        find . -name "*.gradle" -exec sed -i '/package\s*=/d' {} +
        find . -name "*.gradle.kts" -exec sed -i '/package\s*=/d' {} +
        
        echo "Удаляем все существующие манифесты..."
        find . -name "AndroidManifest.xml" -exec rm -f {} +
        
        echo "Генерируем один чистый эталонный манифест..."
        mkdir -p app/src/main
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
            <application
                android:allowBackup="true"
                android:label="Серверная Тревога"
                android:supportsRtl="true">
                <service
                    android:name=".AlarmService"
                    android:enabled="true"
                    android:exported="false"
                    android:foregroundServiceType="specialUse" />
                <receiver
                    android:name=".AlarmMuteReceiver"
                    android:exported="false" />
            </application>
        </manifest>
        EOF
        echo "Очистка и подготовка файлов завершена!"

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Gradle Wrapper
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper --gradle-version 8.5
        fi

    - name: Grant execute permissions for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v5
      with:
        name: server-alarm-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
