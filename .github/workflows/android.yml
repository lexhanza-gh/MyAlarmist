name: Android CI (Автосборка APK)
# Скрипт запускается при каждом пуше (push) в ветку main (или master)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # Позволяет запускать сборку вручную через вкладку Actions на GitHub
  workflow_dispatch:
/
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем исходный код репозитория на виртуальную машину (обновлено до v5 для поддержки Node 24+)
    - name: Checkout project code
      uses: actions/checkout@v5

    # 2. Устанавливаем Java (перешли на v5, убирает варнинг о депрекации)  (необходима для сборки Android проектов)
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Генерируем Gradle Wrapper, если его нет в репозитории
    - name: Generate Gradle Wrapper
      run: |
        if [ ! -f "gradlew" ]; then
          echo "Gradlew not found. Generating wrapper..."
          gradle wrapper --gradle-version 8.5
        fi

    # 4. Даем права на запуск скрипта сборщика
    - name: Grant execute permissions for gradlew
      run: chmod +x gradlew

    - name: Process Debug Manifest
      run: ./gradlew :app:processDebugManifest --info --stacktrace

    - name: Upload Merged Manifest
      if: always() # Загрузит файл, даже если предыдущий шаг упал с ошибкой
      uses: actions/upload-artifact@v5
      with:
        name: merged-debug-manifest
        path: |
          app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml
          app/build/intermediates/**/AndroidManifest.xml
          app/build/intermediates/merged_manifest/**/AndroidManifest.xml
          app/build/intermediates/packaged_manifests/**/AndroidManifest.xml
        if-no-files-found: warn # Не ронять сборку, если какой-то из путей не создался



    # 5. Компилируем проект
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 6. Сохраняем готовый файл (обновлено до v5 для стабильной работы)
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v5
      with:
        name: server-alarm-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
