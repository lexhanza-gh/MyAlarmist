name: Android CI (Автосборка APK)

# Скрипт запускается при каждом пуше (push) в ветку main (или master)
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # Позволяет запускать сборку вручную через вкладку Actions на GitHub
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем исходный код репозитория на виртуальную машину
    - name: Checkout project code
      uses: actions/checkout@v4

    # 2. Устанавливаем Java 17 (необходима для сборки Android проектов)
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. Даем права на исполнение скрипту Gradle сборщика
    - name: Grant execute permissions for gradlew
      run: chmod +x gradlew

    # 4. Запускаем компиляцию приложения в режиме отладки (Debug APK)
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 5. Сохраняем готовый APK файл как артефакт сборки, чтобы его можно было скачать
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: server-alarm-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7 # Файл будет храниться на GitHub 7 дней
